<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" role="img" aria-label="Llama 3.2 1B: one user, tokens per second" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13"><text x="0" y="20" font-size="15" font-weight="600" fill="#7d8590">Llama 3.2 1B: one user, tokens per second</text><text x="238" y="59" text-anchor="end" fill="#7d8590">Phase 1 loop (no paging)</text><rect x="250" y="47" width="37.6" height="18" rx="3" fill="#7d859066"/><text x="295.6" y="60" fill="#7d8590" font-weight="600">16.6 tok/s</text><text x="295.6" y="73" font-size="11" fill="#7d8590">60.18 ms per token · 2.33 GiB</text><text x="238" y="89" text-anchor="end" fill="#7d8590">Paged engine, PyTorch attention</text><rect x="250" y="77" width="22.4" height="18" rx="3" fill="#7d859066"/><text x="280.4" y="90" fill="#7d8590" font-weight="600">9.9 tok/s</text><text x="280.4" y="103" font-size="11" fill="#7d8590">100.7 ms per token · 2.37 GiB</text><text x="238" y="119" text-anchor="end" fill="#7d8590">+ Triton attention kernel</text><rect x="250" y="107" width="39.7" height="18" rx="3" fill="#7d859066"/><text x="297.7" y="120" fill="#7d8590" font-weight="600">17.5 tok/s</text><text x="297.7" y="133" font-size="11" fill="#7d8590">57.24 ms per token · 2.37 GiB</text><text x="238" y="149" text-anchor="end" fill="#7d8590">+ CUDA graphs</text><rect x="250" y="137" width="184.8" height="18" rx="3" fill="#7d859066"/><text x="442.8" y="150" fill="#7d8590" font-weight="600">81.5 tok/s</text><text x="442.8" y="163" font-size="11" fill="#7d8590">12.27 ms per token · 2.38 GiB</text><text x="238" y="179" text-anchor="end" fill="#7d8590">+ CUDA graphs · FP8</text><rect x="250" y="167" width="225.6" height="18" rx="3" fill="#7d859066"/><text x="483.6" y="180" fill="#7d8590" font-weight="600">99.5 tok/s</text><text x="483.6" y="193" font-size="11" fill="#7d8590">10.06 ms per token · 1.53 GiB</text><text x="238" y="209" text-anchor="end" fill="#7d8590">+ CUDA graphs · INT4</text><rect x="250" y="197" width="360.0" height="18" rx="3" fill="#3b82f6"/><text x="618.0" y="210" fill="#7d8590" font-weight="600">158.8 tok/s</text><text x="618.0" y="223" font-size="11" fill="#7d8590">6.3 ms per token · 1.18 GiB</text><text x="238" y="239" text-anchor="end" fill="#7d8590">Speculative, n-gram lookup</text><rect x="250" y="227" width="42.4" height="18" rx="3" fill="#7d859066"/><text x="300.4" y="240" fill="#7d8590" font-weight="600">18.7 tok/s</text><text x="300.4" y="253" font-size="11" fill="#7d8590">53.55 ms per token · 2.41 GiB · 1.18 tokens per pass</text></svg>