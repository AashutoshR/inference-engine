name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      # Hosted runners have no GPU and no model weights: gpu and slow tests are skipped here.
      # Run them locally (or on a self-hosted GPU runner) before merging.
      - name: Unit tests
        run: pytest -m "not gpu and not slow"
